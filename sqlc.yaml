version: "2"
sql:
  - schema: "db/migrations"  # Points to Goose migrations so SQLC knows table structures
    queries: "db/queries"     # Points to SQL query files
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "db/sqlc"
        sql_package: "pgx/v5" # Using pgx v5 driver
        emit_json_tags: true
        emit_prepared_queries: false
